# oxmonad default configuration.
#
# This file is embedded into oxmonad and is the single source of defaults.
# Your own `$XDG_CONFIG_HOME/oxmonad/config.toml` is merged over it:
#
# * tables merge key by key, so you only need to write what you change;
# * other values, including arrays (`workspaces`, `rules`, `scratchpads`),
#   replace the default wholesale;
# * `[keybindings]` / `[pointer_bindings]` entries override the default
#   binding of the same key combination; bind a key to "none" to remove it.
#
# Defaults reproduce the reference xmonad.hs (colors, layouts, bindings) with
# Wayland replacements for X11 programs.

# The modifier `Mod` stands for in bindings: Super, Alt, Ctrl, Shift or a
# `+`-joined combination such as "Ctrl+Alt".
modifier = "Super"

# `spawn-terminal` runs this (myTerminal).
terminal = "alacritty"

# Focus the window under the pointer when the pointer moves onto it
# (xmonad's focusFollowsMouse, True by default). Clicking always focuses.
focus_follows_mouse = true

# Initial workspaces (myWorkspaces). More can be created from the prompt.
workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# The layout ring of every workspace (myLayout), in the order `next-layout`
# cycles through it and the layout picker shows it (`1`–`9`, `0` pick the
# first to tenth). The first entry is each workspace's default layout and
# what `reset-layout` returns to; leave a layout out to remove it from the
# ring. Names are matched ignoring case; each may appear once. Valid names:
# "Tall Right", "Tall", "Wide", "Full", "Tabs", "Grid Rows", "Grid",
# "Three Columns", "Three Columns Right", "Corner", "Corner Right".
layouts = [
  "Tall Right",
  "Tall",
  "Wide",
  "Full",
  "Tabs",
  "Grid Rows",
  "Grid",
  "Three Columns",
  "Three Columns Right",
  "Corner",
  "Corner Right",
]

[border]
width = 1            # myBorderWidth
focused = "#C62828"  # myFocusedBorderColor (colorRed)
normal = "#969694"   # myNormalBorderColor (colorLightGrey)
# Drop the border when focus is obvious (xmonad-contrib smartBorders):
# "single-screen": a tiled window alone on the only screen, and floating
#   windows covering their whole screen (smartBorders);
# "per-screen": the same, but a lone tiled window on any of several screens
#   (lessBorders Screen);
# "off": always draw borders.
smart = "single-screen"

# Text of the bar, prompt and tab strip.
[font]
# "grayscale", or subpixel antialiasing for the screen's subpixel order:
# "rgb" or "bgr". Subpixel text is only drawn over opaque backgrounds.
antialias = "grayscale"

[bar]
visible = true       # default for every workspace; Mod+b toggles it per workspace
position = "top"     # "top" or "bottom"
height = 24
# Outputs with a bar, e.g. output = ["DP-2", "DP-1"]. Unset (the default):
# a bar on every output. Unconnected names are skipped; [] shows no bar.
# primary = "DP-2"   # the bar with tray, battery and clock (default: the
#                    # first bar output); the others show only the left side
font_family = "Fira Mono"
font_size = 12.0
title_max_len = 100  # ppTitle = shorten 100; 0 disables shortening
tray = true          # system tray (StatusNotifierItem icons) left of the clock
tray_icon_size = 16  # tray icon size in logical pixels
layout_icon = true   # a miniature of the current layout next to its name
show_empty_workspaces = false  # list empty hidden workspaces too

[bar.colors]
background = "#161616"    # xmobar bgColor
foreground = "#F2F2F2"    # xmobar fgColor
current = "#F8E63A"       # ppCurrent (colorYellow)
visible = "#F2F2F2"       # ppVisible
hidden = "#F2F2F2"        # ppHidden
hidden_empty = "#969694"  # ppHiddenNoWindows (with show_empty_workspaces)
title = "#86BD47"         # ppTitle (colorGreen)
layout = "#F2F2F2"        # ppLayout (also the layout miniature)

# The workspace prompt (myXPConfig).
[prompt]
position = "bottom"  # XPConfig default
height = 28
font_family = "Fira Mono"
font_size = 16.0

[prompt.colors]
background = "#161616"            # bgColor (colorDarkGrey)
foreground = "#F2F2F2"            # fgColor (colorWhite)
border = "#F2F2F2"                # borderColor
highlight_background = "#1565C1"  # bgHLight (colorBlue)
highlight_foreground = "#F2F2F2"  # fgHLight

# Tab strip of the tabbed layout (xmonad-contrib's default Theme; myTabConf
# only changes the font).
[tabs]
height = 20
font_family = "Fira Mono"
font_size = 12.0
active_color = "#999999"
inactive_color = "#666666"
active_text_color = "#FFFFFF"
inactive_text_color = "#BFBFBF"
active_border_color = "#FFFFFF"
inactive_border_color = "#BBBBBB"

# Virtual screens (`split-screen <n>`): a line between neighbouring virtual
# screens of a split output, so their tilings are easy to tell apart (e.g.
# with smart = "per-screen" above). The screens on either side give up the
# space, so no tiled window sits under it. Never drawn between outputs.
[split]
divider_width = 3            # logical pixels; 0 draws no divider
divider_color = "#1E88E5"    # blue
divider_padding = 2          # empty pixels between the line and the windows

# Key bindings: "Modifiers+Key" = "action". Keys are xkb keysym names.
#
# Actions: spawn <command>, spawn-terminal, focus-next, focus-prev,
# focus-master, swap-next, swap-prev, swap-master, sink, close, next-layout,
# pick-layout, reset-layout, shrink, expand, mirror-shrink, mirror-expand,
# inc-master <n>, view <tag>, shift <tag>, copy <tag>, toggle-ws,
# prompt view|move|copy|rename, remove-workspace, focus-screen next|prev,
# shift-screen next|prev, shift-screen-follow next|prev, swap-next-screen,
# split-screen <n>, rescreen,
# toggle-bar, refresh, quit, reload, restart, toggle-fullscreen,
# toggle-scratchpad <name>, float-move, float-resize, help.
[keybindings]
# Launching programs
"Mod+Shift+Return" = "spawn-terminal"
# The launcher, styled like the old dmenu_run call (Fira Mono 14, #161616 /
# #F2F2F2, selection #F9A825) as a single line across the top.
"Mod+p" = "spawn tofi-run --anchor top --width 100% --height 30 --horizontal true --prompt-text 'run: ' --font 'Fira Mono' --font-size 14 --background-color '#161616' --text-color '#F2F2F2' --selection-color '#F9A825' --border-width 0 --outline-width 0 --padding-top 0 --padding-left 8 --result-spacing 15 | xargs --no-run-if-empty setsid --fork"
# oxmonad-lock (contrib/, installed by deploy/install.sh): slock look via
# waylock or swaylock.
"Mod+Shift+l" = "spawn oxmonad-lock"

# Focus and window movement
"Mod+j" = "focus-next"
"Mod+k" = "focus-prev"
"Mod+Shift+j" = "swap-next"
"Mod+Shift+k" = "swap-prev"
"Mod+Return" = "swap-master"
"Mod+t" = "sink"
"Mod+Shift+c" = "close"
"Mod+o" = "shift-screen-follow next"
"Mod+f" = "toggle-fullscreen"
"Mod+grave" = "toggle-scratchpad term"

# Layouts and resizing
"Mod+space" = "next-layout"
"Mod+Shift+space" = "reset-layout"
# A picture of every layout to choose from (j/k or the arrows, Return or a
# click; Escape cancels).
"Mod+Ctrl+space" = "pick-layout"
"Mod+h" = "shrink"
"Mod+l" = "expand"
"Mod+Up" = "mirror-expand"
"Mod+Down" = "mirror-shrink"
"Mod+comma" = "inc-master 1"
"Mod+period" = "inc-master -1"

# Workspaces
"Mod+1" = "view 1"
"Mod+2" = "view 2"
"Mod+3" = "view 3"
"Mod+4" = "view 4"
"Mod+5" = "view 5"
"Mod+6" = "view 6"
"Mod+7" = "view 7"
"Mod+8" = "view 8"
"Mod+9" = "view 9"
"Mod+Shift+1" = "shift 1"
"Mod+Shift+2" = "shift 2"
"Mod+Shift+3" = "shift 3"
"Mod+Shift+4" = "shift 4"
"Mod+Shift+5" = "shift 5"
"Mod+Shift+6" = "shift 6"
"Mod+Shift+7" = "shift 7"
"Mod+Shift+8" = "shift 8"
"Mod+Shift+9" = "shift 9"
"Mod+Shift+z" = "toggle-ws"
"Mod+v" = "prompt view"
"Mod+m" = "prompt move"
"Mod+Shift+m" = "prompt copy"
"Mod+Shift+r" = "prompt rename"
"Mod+Shift+BackSpace" = "remove-workspace"

# Screens
"Mod+Right" = "focus-screen next"
"Mod+Left" = "focus-screen prev"
"Mod+Shift+Right" = "shift-screen next"
"Mod+Shift+Left" = "shift-screen prev"
"Mod+z" = "swap-next-screen"
# Split the current screen into two virtual screens side by side
# (layoutSplitScreen 2 (TwoPane 0.5 0.5)); rescreen undoes every split.
"Mod+Shift+s" = "split-screen 2"
"Mod+Ctrl+Shift+s" = "rescreen"

# Bar and session
"Mod+b" = "toggle-bar"
"Mod+n" = "refresh"
"Mod+Shift+q" = "quit"
# Restart in place (re-executes the oxmonad binary, e.g. after a rebuild,
# keeping windows and workspaces) and reload this file. "reload" only
# reloads the file; so does SIGUSR1.
"Mod+q" = "restart"
# Every binding of this file, grouped (Escape, q or a click closes it).
"Mod+Shift+slash" = "help"

# Pointer bindings: "Modifiers+Button" = "action" (Button1 left, Button2
# middle, Button3 right).
[pointer_bindings]
"Mod+Button1" = "float-move"
"Mod+Button3" = "float-resize"

# Manage rules, first match wins. Conditions: app_id, title (a glob with
# `*`/`?`, or a list of globs), has_parent. Effects: action = "float" |
# "tile" | "tile-below-master", workspace = "<tag>".
# Windows with a parent (dialogs) float unless a rule says otherwise.

# manageZoomHook: Zoom's main and meeting windows tile out of the master
# slot, every other Zoom window floats.
[[rules]]
app_id = "zoom"
title = ["Zoom - Free Account", "Zoom - Licensed Account", "Zoom", "Zoom Meeting"]
action = "tile-below-master"

[[rules]]
app_id = "zoom"
action = "float"

# Named scratchpads: `toggle-scratchpad <name>` spawns `command` if no
# window with `app_id` exists, otherwise moves it between the current
# workspace and the hidden "NSP" workspace. `rect` = [x, y, w, h] as
# fractions of the screen.
[[scratchpads]]
name = "term"
command = "alacritty --class scratchpad"
app_id = "scratchpad"
rect = [0.1, 0.1, 0.8, 0.8]
