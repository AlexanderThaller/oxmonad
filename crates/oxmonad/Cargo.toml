[package]
name = "oxmonad"
description = "xmonad-style tiling window manager for the river Wayland compositor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oxmonad-core.workspace = true
oxmonad-ui.workspace = true
river-protocols.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
calloop = "0.14"
calloop-wayland-source = "0.4"
kbvm = "0.2"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
signal-hook = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }
resvg = { version = "0.47", default-features = false }
png = "0.18"
async-channel = "2"
futures-lite = "2"
async-io = "2"
async-executor = "1"

[lints]
workspace = true

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
