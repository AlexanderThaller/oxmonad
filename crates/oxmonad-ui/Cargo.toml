[package]
name = "oxmonad-ui"
description = "Software rendering of oxmonad's status bar, prompt and tab strip into wl_shm buffers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fontdb = "0.23"
skrifa = "0.47"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
zeno = { version = "0.3", default-features = false, features = ["eval", "std"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
