[package]
name = "oxmonad-ui"
description = "Software rendering of oxmonad's status bar, prompt and tab strip into wl_shm buffers."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fontdb = "0.24"
skrifa = "0.47"
tiny-skia = { version = "0.12", default-features = false, features = [
  "std",
  "simd",
] }
zeno = { version = "0.3", default-features = false, features = ["eval", "std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true

[[bench]]
name = "render"
harness = false
