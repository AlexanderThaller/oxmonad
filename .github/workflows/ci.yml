name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds for -Ctarget-cpu=native. Runners differ in
  # CPU, so a cached build script compiled on a newer one dies with SIGILL
  # on an older one. RUSTFLAGS replaces the config's rustflags (and is part
  # of rust-cache's key), so CI builds for x86-64-v3 (AVX2), which every
  # GitHub-hosted x86 runner supports.
  RUSTFLAGS: -Ctarget-cpu=x86-64-v3

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .rustfmt.toml uses nightly-only options (imports_granularity, …).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The end-to-end tests are #[ignore]d: they need river, which the
      # runner doesn't have. Everything else, including the golden images,
      # runs here.
      - run: cargo test --workspace --locked
