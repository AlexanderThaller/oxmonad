[package]
name = "oxmonad"
version = "0.1.0"
edition = "2024"
description = "Xmonad inspired window manager written in rust and wayland only."
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"

[dev-dependencies]
# Software renderer for headless snapshot tests (Cargo unifies this feature into
# the smithay build for test/dev profiles only, so release binaries stay lean).
smithay = { version = "0.7", default-features = false, features = ["renderer_pixman"] }
# PNG encode/decode for golden-image comparison.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
#missing-docs = "warn"
missing-debug-implementations = "warn"
rust-2018-idioms = "warn"
# Smithay's client dispatch (`Display::dispatch_clients`) and `env::set_var`
# (unsafe as of edition 2024) need a few `unsafe` blocks. We keep `deny` rather
# than `forbid` so each use can be opted in with a documented
# `#[expect(unsafe_code, reason = "...")]`.
unsafe-code = "deny"
unused-lifetimes = "warn"

[lints.clippy]
allow-attributes = "warn"
allow-attributes-without-reason = "warn"
dbg-macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap-used = "warn"
missing-panics-doc = "allow"
missing-errors-doc = "allow"
wildcard-enum-match-arm = "warn"
disallowed-methods = "deny"

[profile.deploy]
codegen-units = 1
debug = false
incremental = false
inherits = "release"
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
