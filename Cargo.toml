[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oxmonad-core = { path = "crates/oxmonad-core" }
oxmonad-ui = { path = "crates/oxmonad-ui" }
river-protocols = { path = "crates/river-protocols" }
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Every use of `unsafe` must opt in with a documented
# `#[expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
pedantic = { level = "warn", priority = -1 }
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
wildcard_enum_match_arm = "warn"
disallowed_methods = "deny"

[profile.fastdev]
inherits = "release"

[profile.deploy]
codegen-units = 1
debug = false
incremental = false
inherits = "release"
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"
